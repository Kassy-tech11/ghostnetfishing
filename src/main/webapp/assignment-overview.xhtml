<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Zuordnungsübersicht</title>
</h:head>

<h:body>

    <h1>Zuordnungsübersicht</h1>

    <p>
        Diese Übersicht zeigt, welche bergende Person welchem Geisternetz zugeordnet ist.
    </p>

	<nav>
	    <h:link outcome="index.xhtml" value="Startseite" />
	    |
	    <h:link outcome="report.xhtml" value="Geisternetz melden" />
	    |
	    <h:link outcome="open-nets.xhtml" value="Offene Geisternetze" />
	    |
	    <h:link outcome="recovery-overview.xhtml" value="Bergungsübersicht" />
	    |
	    <h:link outcome="assignment-overview.xhtml" value="Zuordnungsübersicht" />
	</nav>

	<hr />
    <h:panelGroup rendered="#{empty assignmentOverviewBean.assignedGhostNets}">
        <p>Aktuell sind keine Geisternetze einer bergenden Person zugeordnet.</p>
    </h:panelGroup>

    <h:dataTable value="#{assignmentOverviewBean.assignedGhostNets}"
                 var="net"
                 border="1"
                 cellpadding="6"
                 rendered="#{not empty assignmentOverviewBean.assignedGhostNets}">

        <h:column>
            <f:facet name="header">Netz-ID</f:facet>
            <h:outputText value="#{net.id}" />
        </h:column>

        <h:column>
            <f:facet name="header">Breitengrad</f:facet>
            <h:outputText value="#{net.latitude}" />
        </h:column>

        <h:column>
            <f:facet name="header">Längengrad</f:facet>
            <h:outputText value="#{net.longitude}" />
        </h:column>

        <h:column>
            <f:facet name="header">Größe in m²</f:facet>
            <h:outputText value="#{net.estimatedSizeM2}" />
        </h:column>

        <h:column>
            <f:facet name="header">Status</f:facet>
            <h:outputText value="#{net.status.label}" />
        </h:column>

        <h:column>
            <f:facet name="header">Bergende Person</f:facet>
            <h:outputText value="#{net.recoverer.name}" />
        </h:column>

        <h:column>
            <f:facet name="header">Telefonnummer</f:facet>
            <h:outputText value="#{net.recoverer.phoneNumber}" />
        </h:column>

    </h:dataTable>

    <br />

    <h:link outcome="open-nets.xhtml" value="Offene Geisternetze anzeigen" />
    <br />
    <h:link outcome="recovery-overview.xhtml" value="Bergungsübersicht anzeigen" />
    <br />
    <h:link outcome="index.xhtml" value="Zur Startseite" />

</h:body>
</html>
