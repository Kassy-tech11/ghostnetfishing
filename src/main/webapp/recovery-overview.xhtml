<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Bergungsübersicht</title>
	<h:outputStylesheet library="css" name="style.css" />
</h:head>

<h:body>

    <h1>Bergungsübersicht</h1>

    <p>
        Diese Übersicht zeigt alle Geisternetze, für die eine Bergung bevorsteht.
    </p>

	<p>
		    <h:button outcome="index.xhtml" value="Startseite" styleClass="nav-button"/>
		    |
		    <h:button outcome="report.xhtml" value="Geisternetz melden" styleClass="nav-button"/>
		    |
		    <h:button outcome="open-nets.xhtml" value="Offene Geisternetze" styleClass="nav-button"/>
		    |
		    <h:button outcome="recovery-overview.xhtml" value="Bergungsübersicht" styleClass="nav-button"/>
		    |
		    <h:button outcome="assignment-overview.xhtml" value="Zuordnungsübersicht" styleClass="nav-button"/>
		    |
		    <h:button outcome="recovery-requests.xhtml" value="Übernahmeanfragen" styleClass="nav-button"/>
		</p>

	<hr />
    <h:messages globalOnly="false" style="color:red;" />

    <h:panelGroup rendered="#{empty recoveryOverviewBean.pendingRecoveries}">
        <p>Aktuell gibt es keine laufenden Bergungen.</p>
    </h:panelGroup>

    <h:form rendered="#{not empty recoveryOverviewBean.pendingRecoveries}">

        <h:dataTable value="#{recoveryOverviewBean.pendingRecoveries}"
                     var="net"
                     border="1"
                     cellpadding="6">

            <h:column>
                <f:facet name="header">ID</f:facet>
                <h:outputText value="#{net.id}" />
            </h:column>

            <h:column>
                <f:facet name="header">Breitengrad</f:facet>
                <h:outputText value="#{net.latitude}" />
            </h:column>

            <h:column>
                <f:facet name="header">Längengrad</f:facet>
                <h:outputText value="#{net.longitude}" />
            </h:column>

            <h:column>
                <f:facet name="header">Größe in m²</f:facet>
                <h:outputText value="#{net.estimatedSizeM2}" />
            </h:column>

            <h:column>
                <f:facet name="header">Status</f:facet>
                <h:outputText value="#{net.status.label}" />
            </h:column>

            <h:column>
                <f:facet name="header">Bergende Person</f:facet>
                <h:outputText value="#{net.recoverer.name}" />
            </h:column>

            <h:column>
                <f:facet name="header">Telefonnummer</f:facet>
                <h:outputText value="#{net.recoverer.phoneNumber}" />
            </h:column>

			<h:column>
			    <f:facet name="header">Aktion</f:facet>

			    <h:commandButton value="Als geborgen markieren"
			                     action="#{recoveryOverviewBean.markAsRecovered(net.id)}"
			                      styleClass="action-button" />

			    <br />

			    <h:button outcome="takeover-request.xhtml"
			              value="Übernahme anfragen"
			              rendered="#{net.takeoverRequestable}"
			               styleClass="action-button">
			        <f:param name="id" value="#{net.id}" />
			    </h:button>
			</h:column>

        </h:dataTable>

    </h:form>

    <br />

    <h:button outcome="open-nets.xhtml" value="Offene Geisternetze anzeigen"  styleClass="action-button"/>
    <br />
    <h:button outcome="index.xhtml" value="Zur Startseite"  styleClass="action-button"/>

</h:body>
</html>
